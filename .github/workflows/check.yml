name: check

# Feedback for the pull request's author: validates every file and annotates problems.
# Untrusted: for a pull request from a fork, GitHub runs the pull request's own copy of this
# file. merge.yml never relies on its result; it validates again with the CLI pinned on main.
on:
  pull_request:

permissions: {}

env:
  # config-cli from open-macaron/macaron (@open-macaron/config-cli@0.1.4); the PR bumping it verified
  # its build attestation.
  CONFIG_CLI_URL: https://github.com/open-macaron/macaron/releases/download/%40open-macaron%2Fconfig-cli%400.1.4/config-cli.mjs
  CONFIG_CLI_SHA256: "4ed3fd24014a4be1c98f4d0b306131be9893091a5e0d87ed1e3aa8b1752d4928"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: config-cli
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/config-cli.mjs" "$CONFIG_CLI_URL"
          echo "$CONFIG_CLI_SHA256  $RUNNER_TEMP/config-cli.mjs" | sha256sum --check --strict -
      - name: validate (the controller's checks, OWNERS.yaml, owners' logins)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/config-cli.mjs" validate . --check-logins
