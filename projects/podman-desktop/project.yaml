# yaml-language-server: $schema=https://raw.githubusercontent.com/open-macaron/macaron/main/packages/contracts/schemas/config-project.schema.json
#
# Podman Desktop itself (podman-desktop/podman-desktop): reviews against the podman-desktop rules of
# open-macaron/knowledge, and the other modes in the Podman Desktop environment.

project: podman-desktop
owners: "@open-macaron/maintainers"
bots: []
budget:
  monthUsd: 30.00
concurrency: 1
defaults:
  runsOn: ubuntu-26.04
  timeoutMinutes: 45
  budgets:
    implement: 5.00
    address_review: 2.00
